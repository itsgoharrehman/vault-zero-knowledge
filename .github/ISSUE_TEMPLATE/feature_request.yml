name: Feature Request
description: Propose a new feature, improvement, or architectural enhancement
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a new feature or architectural enhancement for Vault.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is this feature related to a limitation or pain point?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Clear description of the proposed feature and implementation approach.
    validations:
      required: true
  - type: textarea
    id: security_impact
    attributes:
      label: Cryptographic and Security Implications
      description: Does this feature affect the client-side encryption boundary, key derivation, or zero-knowledge invariants?
    validations:
      required: true